name: Build stable release from test

on:
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Published test release tag, for example test-v1.004.003'
        required: true
        type: string
      stable_version:
        description: 'Optional stable version, for example 1.004.003 (blank = test version)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted release tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: automation
          persist-credentials: false

      - name: Check release tools
        working-directory: automation
        run: python3 -m unittest discover -s tests -v

      - name: Resolve published test release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TAG: ${{ inputs.test_tag }}
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: |
          python3 automation/tools/promote_test_release.py resolve \
            --test-tag "$TEST_TAG" --stable-version "$STABLE_VERSION" \
            --output promotion-resolution.json

      - name: Check out exactly the tested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.release.outputs.commit }}
          path: tested-source
          persist-credentials: false

      # Run only the trusted default-branch tools, not scripts supplied by the test tag.
      - name: Verify published test ZIP and build stable ZIP
        run: |
          python3 automation/tools/promote_test_release.py build \
            --root tested-source --resolution promotion-resolution.json --output dist

      - name: Save release ZIP, checksum and verification details
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SwitchLauncher-${{ steps.release.outputs.stable_version }}-release
          path: |
            dist/SwitchLauncher-*.zip
            dist/SwitchLauncher-*.zip.sha256
            dist/promotion.json
          if-no-files-found: error
          retention-days: 30
